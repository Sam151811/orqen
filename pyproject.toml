[project]
name = "orqen"
version = "0.1.0"
description = "An empirical AI bill of materials: measures what a model does, not what its card claims."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "python-multipart>=0.0.12",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
]

# `pip install -e .` puts `orqen` on PATH, which is what the CI gate example in
# the README assumes. Without it only `python -m orqen.cli` works.
[project.scripts]
orqen = "orqen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orqen*"]
